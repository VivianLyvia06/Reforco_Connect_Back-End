# Nome da sua aplicação
spring.application.name=reforco_connect

# Conexão com o Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/reforco_connect
spring.datasource.username=aluno
spring.datasource.password=aluno

# Configurações do Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'update' faz o Spring criar/atualizar as tabelas automaticamente no Postgres
spring.jpa.hibernate.ddl-auto=update

# Mostra o comando SQL no console para você ver a mágica acontecendo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true